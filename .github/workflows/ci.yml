# Builds, typechecks and tests every pull request and every push to main, on each Node version we support.
# The packaging tests install the packed tarball, so this checks the package as it would be published.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Webhook vectors are current
        run: npm run test:vectors -w node
      - name: Packaging tests
        run: npm run test:packaging

  changeset:
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Changeset present
        run: npx changeset status --since=origin/main
